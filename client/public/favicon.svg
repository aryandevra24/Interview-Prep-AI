<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071A5C"/>
      <stop offset="100%" stop-color="#172E9B"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow
        dx="0"
        dy="10"
        stdDeviation="12"
        flood-opacity=".28"
      />
    </filter>
  </defs>

  <!-- Background -->
  <rect
    width="512"
    height="512"
    rx="112"
    fill="url(#bg)"
  />

  <!-- AI halo -->
  <circle
    cx="256"
    cy="210"
    r="145"
    fill="none"
    stroke="url(#cyan)"
    stroke-width="12"
    opacity=".85"
  />

  <!-- Antenna -->
  <path
    d="M256 76V112"
    stroke="#67E8F9"
    stroke-width="10"
    stroke-linecap="round"
  />

  <circle
    cx="256"
    cy="62"
    r="22"
    fill="#67E8F9"
  />

  <!-- Robot -->
  <g filter="url(#shadow)">
    <!-- Head -->
    <rect
      x="130"
      y="112"
      width="252"
      height="180"
      rx="72"
      fill="#F8FAFC"
    />

    <!-- Face -->
    <rect
      x="158"
      y="148"
      width="196"
      height="112"
      rx="48"
      fill="#07184F"
    />

    <!-- Eyes -->
    <path
      d="M198 207c0-18 14-32 30-32s30 14 30 32"
      fill="none"
      stroke="#22D3EE"
      stroke-width="13"
      stroke-linecap="round"
    />

    <path
      d="M284 207c0-18 14-32 30-32s30 14 30 32"
      fill="none"
      stroke="#22D3EE"
      stroke-width="13"
      stroke-linecap="round"
    />

    <!-- Ear pieces -->
    <rect
      x="112"
      y="170"
      width="28"
      height="72"
      rx="14"
      fill="#22D3EE"
    />

    <rect
      x="372"
      y="170"
      width="28"
      height="72"
      rx="14"
      fill="#2563EB"
    />
  </g>

  <!-- Resume card -->
  <g transform="rotate(-12 170 360)" filter="url(#shadow)">
    <rect
      x="74"
      y="290"
      width="188"
      height="150"
      rx="20"
      fill="#F8FAFC"
    />

    <!-- Profile -->
    <circle
      cx="116"
      cy="332"
      r="18"
      fill="#38BDF8"
    />

    <path
      d="M96 372c6-22 34-22 40 0"
      fill="#38BDF8"
    />

    <!-- Resume lines -->
    <rect x="148" y="319" width="76" height="9" rx="4.5" fill="#38BDF8"/>
    <rect x="148" y="341" width="60" height="8" rx="4" fill="#60A5FA"/>
    <rect x="94" y="393" width="130" height="8" rx="4" fill="#60A5FA"/>
    <rect x="94" y="411" width="112" height="8" rx="4" fill="#60A5FA"/>
  </g>

  <!-- Career card -->
  <g transform="rotate(8 350 360)" filter="url(#shadow)">
    <rect
      x="274"
      y="294"
      width="164"
      height="142"
      rx="20"
      fill="#172E9B"
    />

    <!-- Briefcase -->
    <rect
      x="318"
      y="330"
      width="76"
      height="58"
      rx="12"
      fill="#F8FAFC"
    />

    <path
      d="M340 330v-12c0-8 6-14 14-14h4c8 0 14 6 14 14v12"
      fill="none"
      stroke="#F8FAFC"
      stroke-width="10"
      stroke-linecap="round"
    />

    <rect
      x="346"
      y="348"
      width="20"
      height="12"
      rx="4"
      fill="#2563EB"
    />

    <rect x="304" y="402" width="105" height="7" rx="3.5" fill="#60A5FA"/>
  </g>

  <!-- Growth arrow -->
  <path
    d="M304 320l45-40 32 24 62-72"
    fill="none"
    stroke="#22D3EE"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <path
    d="M421 230h42v42"
    fill="none"
    stroke="#22D3EE"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Chat bubble -->
  <g filter="url(#shadow)">
    <path
      d="M166 398
         h148
         a38 38 0 0 1 38 38
         a38 38 0 0 1-38 38
         h-76
         l-32 25
         7-25
         h-47
         a38 38 0 0 1-38-38
         a38 38 0 0 1 38-38z"
      fill="url(#purple)"
    />

    <!-- Chat dots -->
    <circle cx="200" cy="436" r="8" fill="#fff"/>
    <circle cx="240" cy="436" r="8" fill="#fff"/>
    <circle cx="280" cy="436" r="8" fill="#fff"/>
  </g>
</svg>